# biject-wall — nginx config.
#
# Serves the single-file dashboard and proxies /trace/ to biject-trace so the
# page can use a same-origin TRACE_BASE (/trace) with no CORS involvement.
#
# The upstream is held in a variable and resolved per request via Docker's
# embedded DNS (127.0.0.11). That keeps the wall able to START while
# biject-trace is down — the page's status dot reports "reconnecting" instead
# of nginx refusing to boot on an unresolvable upstream. Same philosophy as
# the platform compose file: an observer comes up and reports an outage
# rather than joining it. Outside Docker, override the resolver or use the
# page's ?trace= parameter to point at a reachable trace instance.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # The dashboard is the only document.
    location = / {
        try_files /wall.html =404;
    }
    location = /wall.html {
        try_files /wall.html =404;
    }

    # Same-origin path the page uses by default: /trace/... -> biject-trace.
    location /trace/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $trace_upstream http://biject-trace:8010;
        rewrite ^/trace/(.*)$ /$1 break;
        proxy_pass $trace_upstream;

        # SSE (/v1/verdicts/stream) must flow unbuffered and stay open.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
