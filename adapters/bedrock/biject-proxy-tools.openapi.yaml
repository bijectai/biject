openapi: 3.0.3
# ---------------------------------------------------------------------------
# STATUS: WRITTEN, NOT YET RUN (ticket S4-D-31).
#
# This document has never been attached to a Bedrock AgentCore Gateway and has
# never been exercised against a live proxy deployment. It is authored from
# the proxy's source of truth (biject-proxy src/extract.rs + src/lib.rs and
# contracts/tool_calls.json DRAFT v0) so that field names and casing byte-match
# the proxy's deny_unknown_fields structs. Any claim of Bedrock compatibility
# is a design intent, not an observed result. See adapters/bedrock/README.md.
# ---------------------------------------------------------------------------
info:
  title: biject verification proxy — OpenClinica tool surface (Bedrock AgentCore Gateway target)
  version: 0.1.0-draft
  description: |
    STATUS: WRITTEN, NOT YET RUN. This spec has not been attached to any
    Bedrock AgentCore Gateway, and no request described here has been sent to a
    deployed proxy. It exists so the attachment can be attempted without
    re-deriving the wire shapes; treat every statement about gateway behaviour
    as unexercised design intent until a run says otherwise.

    The two operations are the same two tools the OpenAI Agents adapter
    (adapters/openai/tools.py) exposes — list open data-clarification queries,
    write a single item correction — pointed at the Rust verification proxy's
    §8 routes. The proxy verifies a typed audit entry against the Lean kernel
    BEFORE anything is forwarded to OpenClinica; a request that cannot be
    positively verified is denied with 403, never forwarded.

    Every request to either operation MUST carry the `X-Biject-Agent-Id`
    header — the identity of the CALLING AGENT, which is distinct from the
    body's `actorId` (the WHO a change is attributed to). The header is
    deliberately NOT modeled as an operation parameter here: agent identity
    must never be a value the model chooses. It is expected to be injected at
    the gateway layer (see the README for the intended mechanism). A request
    without it is denied 403.

    Provenance fields (`actorId`, `tsUnixMs`, `sigEd25519`) are populated by
    the harness signing pipeline (ticket S4-A-30), never chosen by the model.
    A fabricated signature fails kernel verification and the proxy denies —
    fail closed — but that also means the write operation is not functional
    through a gateway until a signing injection point exists. See the README.
servers:
  - url: https://{demoDomain}
    description: >
      PLACEHOLDER — no deployed demo domain exists yet. The real proxy
      subdomain lands with ticket S4-D-10 (host provisioning); substitute it
      for {demoDomain} at attach time. The default below is a reserved
      .invalid name precisely so it can never resolve to a real host.
    variables:
      demoDomain:
        default: biject-proxy.pending-s4d10.invalid
        description: >
          Fully-qualified hostname of the deployed verification proxy.
          Unknown until S4-D-10 runs; the default is intentionally
          unresolvable (RFC 2606 .invalid).
paths:
  /queries/open:
    get:
      operationId: openclinica_list_queries
      summary: List open data-clarification queries (discrepancy notes) for a study.
      description: |
        Read-only, but still gated: the proxy verifies the read against the
        kernel before touching OpenClinica, and any non-positive verdict —
        including `skipped` (no compiled policy) — is a 403 denial. Requires
        the `X-Biject-Agent-Id` header (gateway-injected, not a model input).
        Returned `description` strings are free text written by humans in the
        EDC; they are advisory context for the agent and must never be fed
        back as a parameter of any tool call.
      parameters:
        - name: studyOid
          in: query
          required: true
          description: >
            OpenClinica study OID whose open queries are listed. Closed
            identifier class — letters, digits, '_' and '-' only, 1-64
            characters (the proxy validates each OID segment to 64 chars).
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{1,64}$'
            minLength: 1
            maxLength: 64
            example: S_BJT01
      responses:
        '200':
          description: Verified and forwarded; the open queries for the study.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOpenQueriesResponse'
        '403':
          description: >
            Denied. Every failure mode on the way to a positive verdict — a
            refusing verdict, a verifier timeout or error, a missing policy
            (`skipped`), a contract violation, or a missing
            X-Biject-Agent-Id header — returns this shape. Nothing was
            forwarded to OpenClinica.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Denial'
        '502':
          description: >
            Authorized, but the downstream OpenClinica read failed. The
            failure is downstream of the verification gate, not at it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
  /items/write:
    post:
      operationId: openclinica_write_item
      summary: Write a verified correction to a single OpenClinica item value.
      description: |
        The proxy reads the item's current value (so the "before" state is
        observed, not asserted), builds a typed audit entry — only the
        SHA-256 of `newValue` reaches the kernel, never the raw value — and
        forwards to OpenClinica ONLY after the Lean kernel proves the audit
        bound. Unverifiable corrections are denied 403, not forwarded.
        Requires the `X-Biject-Agent-Id` header (gateway-injected, not a
        model input). The body is exactly six fields; unknown fields are
        refused at the boundary (`deny_unknown_fields`), so a gateway must
        not add envelope fields of its own.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WriteItemCorrection'
      responses:
        '200':
          description: Verified, forwarded, and written to OpenClinica.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WriteItemResponse'
        '403':
          description: >
            Denied. Every failure mode on the way to a positive verdict —
            including an unreadable pre-state (`upstream_read_failed`) and a
            signature the kernel rejects — returns this shape. Nothing was
            written to OpenClinica.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Denial'
        '502':
          description: >
            Authorized, but the downstream OpenClinica write failed. The
            failure is downstream of the verification gate, not at it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
components:
  schemas:
    WriteItemCorrection:
      type: object
      description: >
        Byte-matches the proxy's deny_unknown_fields struct
        (biject-proxy src/extract.rs, WriteItemCorrection): exactly these six
        camelCase fields, all required, nothing else admitted. actorId,
        tsUnixMs and sigEd25519 come from the harness signing pipeline
        (S4-A-30) — a model-fabricated signature fails verification and the
        call is denied.
      additionalProperties: false
      required:
        - itemOid
        - newValue
        - actorId
        - reasonCode
        - tsUnixMs
        - sigEd25519
      properties:
        itemOid:
          type: string
          description: >
            Fully-qualified OID path with exactly six segments —
            StudyOID/SubjectKey/StudyEventOID/FormOID/ItemGroupOID/ItemOID —
            each segment 1-64 characters of [A-Za-z0-9_-]. A sentence cannot
            fit this pattern; prose cannot address a record.
          pattern: '^[A-Za-z0-9_-]{1,64}(/[A-Za-z0-9_-]{1,64}){5}$'
          example: S_BJT01/SS_1001/SE_VISIT1/F_VITALS_V1/IG_VITALS/I_WEIGHT_KG
        newValue:
          type: string
          maxLength: 4000
          description: >
            The corrected value, forwarded verbatim to OpenClinica alone.
            KERNEL BOUNDARY: this string never reaches the Lean kernel — only
            its SHA-256 hex digest is bound into the audit entry the kernel
            checks.
        actorId:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]*$'
          minLength: 1
          maxLength: 128
          description: >
            Identity of the acting principal — the WHO a change is attributed
            to in the signed ledger (distinct from the X-Biject-Agent-Id
            header, the calling agent). Populated by the harness signing
            pipeline (S4-A-30), never chosen by the model.
        reasonCode:
          type: integer
          enum: [0, 1, 2, 3, 4, 5, 6, 7]
          description: >
            Reason for the correction — a closed integer enum, never free
            text. 0=SOURCE_DATA_CONFIRMED, 1=TRANSCRIPTION_ERROR,
            2=UNIT_CORRECTION, 3=DECIMAL_SHIFT, 4=CROSS_FIELD_RECONCILIATION,
            5=MISSING_VALUE_COMPLETION, 6=INVESTIGATOR_CONFIRMED,
            7=OTHER_DOCUMENTED.
        tsUnixMs:
          type: integer
          format: int64
          minimum: 0
          description: >
            Audit-entry timestamp, Unix epoch milliseconds (UTC). Populated
            by the harness signing pipeline (S4-A-30), never chosen by the
            model. Must be strictly greater than the ledger head or the
            kernel refuses it as backdated/replayed.
        sigEd25519:
          type: string
          pattern: '^[A-Za-z0-9+/]{86}==$'
          minLength: 88
          maxLength: 88
          description: >
            Ed25519 signature over the canonical audit-entry bytes
            (canonicalization owned by S4-A-30), base64 — a 64-byte signature
            encodes to exactly 88 characters ending '=='. Produced by the
            harness signing pipeline; the signing key never appears in any
            request, response, or spec.
    WriteItemResponse:
      type: object
      description: Success shape returned by the proxy after a verified write.
      properties:
        forwarded:
          type: boolean
          description: Always true on this shape — the gate was passed.
        call_id:
          type: string
          description: The call id minted by biject-api; lands in the signed ledger.
        verdict:
          type: string
          enum: [allowed]
          description: Echoed so a console can render the verdict without a second lookup.
        policy_id:
          type: string
        verify_latency_us:
          type: integer
          format: int64
        elab_us:
          type: integer
          format: int64
        total_latency_us:
          type: integer
          format: int64
        item_oid:
          type: string
          description: The canonical six-segment path that was written.
        new_value_hash:
          type: string
          description: >
            SHA-256 hex of the written value. The digest, not the value — a
            response body is an output surface.
        edc_receipt:
          type: string
          description: OpenClinica's receipt, truncated to 1024 characters.
    ListOpenQueriesResponse:
      type: object
      description: Success shape returned by the proxy after a verified read.
      properties:
        forwarded:
          type: boolean
          description: Always true on this shape — the gate was passed.
        call_id:
          type: string
        policy_id:
          type: string
        verify_latency_us:
          type: integer
          format: int64
        total_latency_us:
          type: integer
          format: int64
        count:
          type: integer
        queries:
          type: array
          items:
            $ref: '#/components/schemas/OpenQuery'
    OpenQuery:
      type: object
      description: >
        One open discrepancy note with the item context an agent needs to
        resolve it. Field names are snake_case exactly as the proxy
        serializes them.
      properties:
        item_oid:
          type: string
        subject_key:
          type: string
        event_oid:
          type: string
        form_oid:
          type: string
        item_group_oid:
          type: string
        value:
          type: string
          description: Current value of the item the note is attached to.
        note_id:
          type: string
        status:
          type: string
        description:
          type: string
          description: >
            Free text written by a human in the EDC. Advisory only — context
            for the agent's reasoning, never to be passed back as a
            parameter of any tool call.
    Denial:
      type: object
      description: >
        Every denial leaves by one door: status 403, forwarded=false, and an
        enumerated reason a caller can branch on without parsing prose.
        `detail` is the human string and carries no decision weight.
      properties:
        forwarded:
          type: boolean
          enum: [false]
        reason:
          type: string
          enum:
            - policy
            - verifier_timeout
            - verifier_unreachable
            - verifier_error
            - malformed_verdict
            - contract_violation
            - unknown_target
            - upstream_read_failed
        detail:
          type: string
        call_id:
          type: string
    GatewayError:
      type: object
      description: >
        Reported as 502 — authorization happened and succeeded; the failure
        is downstream of the gate, not at it.
      properties:
        forwarded:
          type: boolean
          enum: [true]
        call_id:
          type: string
        error:
          type: string
