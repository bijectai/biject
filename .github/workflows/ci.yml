# CI for the meta repo.
#
# Two jobs, not the four the service repos run: there is no application code here
# and no image to publish. See .claude/deviations/repo-structure-standard.md for
# why that departure is deliberate rather than an omission.
#
# Both jobs are cheap and deterministic, which is the point — a bad pin or a
# malformed topology should fail on the PR, not at deploy.
name: ci

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  compose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: docker-compose.yml must parse and resolve
        env:
          # Synthetic values. `config` resolves interpolation without starting
          # anything, and AUDIT_SIGNING_KEY uses ${VAR:?} so the file
          # deliberately refuses to resolve without it — supplying a placeholder
          # here checks the syntax without weakening that guard in .env.example.
          AUDIT_SIGNING_KEY: ci-placeholder-not-a-real-key
        run: docker compose config -q

      - name: No secret may be committed in any compose file
        run: |
          set -euo pipefail
          # A key written into a compose file is a committed secret. Values must
          # arrive from .env, which is gitignored. This looks for a literal
          # assignment, not a ${VAR} reference.
          #
          # Compose accepts two environment syntaxes and BOTH are used in this
          # repo — the root topology uses mapping form, infra/hetzner/ uses list
          # form — so both must be matched. Checking only one would let a
          # plaintext credential through in valid YAML.
          NAMES='(SIGNING_KEY|API_KEY|_TOKEN|PASSWORD|SECRET)'

          # Mapping form:  KEY: value
          # Anchored to the start of a YAML key. Without the anchor it also
          # matches inside `${VAR:?message}` and `${VAR:-}`, where the character
          # after the colon is part of the default syntax rather than a value.
          MAPPING="^[[:space:]]+[A-Z_]*${NAMES}[A-Z_]*:[[:space:]]+[^\$[:space:]]"

          # List form:  - KEY=value
          LIST="^[[:space:]]+-[[:space:]]*[A-Z_]*${NAMES}[A-Z_]*=[^\$[:space:]]"

          found=0
          while IFS= read -r file; do
            # Quotes are stripped before matching. YAML lets a scalar be quoted
            # in several places — `- "KEY=v"`, `- 'KEY=v'`, `KEY: "v"` — and
            # each variant would need its own alternative in the pattern. Trying
            # to enumerate them is how the previous two versions of this check
            # both ended up with a hole. Removing the quote characters first
            # collapses every variant onto the two forms above, and it cannot
            # create a false positive: a `${VAR}` reference still starts with
            # `$` after the quotes come off, so it still fails to match.
            # Line numbers are preserved, so the report still points at the
            # right line.
            if tr -d '\042\047' < "$file" | grep -nE "$MAPPING|$LIST"; then
              echo "::error title=Committed secret::$file assigns a literal value to a key or token."
              found=1
            fi
          done < <(git ls-files '*docker-compose*.yml' '*docker-compose*.yaml' '*compose.yml' '*compose.yaml')

          if [ "$found" -ne 0 ]; then
            echo "Secrets come from .env (gitignored). Put an empty placeholder in .env.example instead."
            exit 1
          fi
          echo "No literal secrets in any compose file."

  pins:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Every image must be pinned to something immutable
        run: ./scripts/verify-pins.sh

      - name: Shell scripts must parse
        run: |
          set -euo pipefail
          for f in scripts/*.sh; do
            bash -n "$f"
            echo "  ok  $f"
          done
