# =============================================================================
# S4-D-11 — OpenClinica 3.17 CE configuration TEMPLATE (datainfo.properties)
# =============================================================================
# This is a TEMPLATE, not the live file. docker-entrypoint.sh renders it with
# envsubst (only the ${OC_*} / ${DEMO_DOMAIN} placeholders below are
# substituted; OC-internal ${catalina.home} references pass through) into:
#     webapps/OpenClinica/WEB-INF/classes/datainfo.properties
#     webapps/OpenClinica-ws/WEB-INF/classes/datainfo.properties
# The UI and ws apps deliberately share this one config: same database, same
# filePath, so SOAP writes land in the same studies the UI shows.
#
# NO REAL SECRETS HERE — DB credentials arrive via environment at container
# start (from ../.env). Keep it that way.
# =============================================================================

# --- Database ----------------------------------------------------------------
# Points at the `oc-db` service on the biject-edc-internal network.
dbType=postgres
dbHost=${OC_DB_HOST}
dbPort=${OC_DB_PORT}
db=${OC_DB_NAME}
dbUser=${OC_DB_USER}
dbPass=${OC_DB_PASSWORD}

# --- Data directory (filePath) ----------------------------------------------
# OC's on-disk store for CRF templates, attachments, and dataset extracts.
# Backed by the biject-oc-data named volume (persistence acceptance criterion).
# OC expects a trailing slash.
filePath=/usr/local/tomcat/openclinica.data/

# Leave attached_file_location empty to store attachments under filePath.
attached_file_location=

# --- System URL --------------------------------------------------------------
# What OC believes its own public URL is (used in emails and some redirects).
# Traefik terminates TLS for https://${DEMO_DOMAIN}/OpenClinica and forwards
# to Tomcat on the internal network.
sysURL=https://${DEMO_DOMAIN}/OpenClinica/MainMenu

# --- Mail --------------------------------------------------------------------
# NOTE: the EDC network is internal-only (no egress), so mail only works if a
# relay is run inside the enclave. For the demo, notification mail is best
# left non-functional; account passwords can be set by the admin in the UI.
adminEmail=${OC_ADMIN_EMAIL}
mailHost=${OC_MAIL_HOST}
mailPort=25
mailProtocol=smtp
mailSmtpAuth=false
mailUsername=
mailPassword=
mailSmtpStarttls.enable=false
mailSmtpsAuth=false
mailSmtpsStarttls.enable=false
mailErrorMsg=${OC_ADMIN_EMAIL}

# When 'email', new accounts get credentials mailed (won't work here — see
# mail note above). The admin can view/reset passwords in the UI instead.
user_account_notification=email

# --- Logging -----------------------------------------------------------------
# ${catalina.home} below is resolved by OC/Tomcat at runtime, NOT by envsubst
# (the entrypoint substitutes only an explicit variable list).
log.dir=${catalina.home}/logs
logLocation=local
logLevel=info
syslog.host=
syslog.port=

# --- Misc / sane demo defaults ----------------------------------------------
# HTTP session timeout, seconds.
maxInactiveInterval=3600
# Allowed upload extensions for CRF attachments.
crfFileExtensions=pdf,doc,docx,xls,xlsx,png,jpg
crfFileExtensionSettings=allowed
supportURL=https://www.openclinica.com/community
about.text1=biject sprint demo
about.text2=OpenClinica 3.17 CE behind the biject verification proxy
