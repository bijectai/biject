# =============================================================================
# S4-D-11 — OpenClinica 3.17 Community Edition + Postgres 9.5
# =============================================================================
# Sibling compose PROJECT to ../docker-compose.yml (deliberate — see the
# "WHERE IS OPENCLINICA?" note there). It attaches to the networks that the
# edge stack creates, referenced here by fixed name as `external: true`.
#
# Startup order (documented in README.md):
#   1. edge stack:  cd .. && docker compose up -d          (creates networks)
#   2. this stack:  docker compose --env-file ../.env \
#                     -f docker-compose.openclinica.yml up -d --build
#
# The shared .env lives at ../.env (copy from ../.env.example) — hence the
# explicit --env-file flag above; do NOT keep a second .env in this folder.
#
# ENFORCEMENT BOUNDARY (recap from S4-D-10): both services here live ONLY on
# `biject-edc-internal` (internal: true). No host ports are published — not
# for Postgres (CRITICAL: never add a `ports:` entry to oc-db) and not for
# Tomcat. The only reachability is:
#   * verify proxy  -> http://openclinica:8080/OpenClinica-ws/...  (SOAP writes)
#   * traefik       -> http://openclinica:8080/OpenClinica         (human UI,
#     basic-auth'd; the /OpenClinica-ws path is EXCLUDED from the router rule
#     below, so the SOAP API is unreachable from the internet)
# =============================================================================

networks:
  # Created by ../docker-compose.yml — bring that stack up first.
  edc_internal:
    external: true
    name: biject-edc-internal
  # Declared for symmetry/reference only; intentionally unused by services in
  # this file. OC must never join the edge network.
  edge:
    external: true
    name: biject-edge

volumes:
  # Persistence is an acceptance criterion: both survive `down`/redeploys.
  oc_pgdata:
    name: biject-oc-pgdata     # Postgres 9.5 data directory
  oc_data:
    name: biject-oc-data       # OC filePath dir (CRFs, extracts, uploads)

services:
  # ===========================================================================
  # oc-db — Postgres 9.5 (the newest version OC 3.x is validated against; do
  # not "helpfully" upgrade it, OC 3.17's schema migrations break on 10+).
  # ===========================================================================
  oc-db:
    image: postgres:9.5
    restart: unless-stopped
    networks:
      # Static IP pinned to match infra/hetzner/firewall/ defaults
      # (PG_DIRECT_HOSTPORT in verify_lockdown.sh probes .40).
      edc_internal:
        ipv4_address: 172.28.100.40
    # NO `ports:` — see header. Postgres is reachable only as oc-db:5432 from
    # inside biject-edc-internal (i.e. by the openclinica service and nothing
    # else; even the proxy has no business talking to it).
    environment:
      # Superuser password for the container (init only; app never uses it).
      POSTGRES_PASSWORD: ${OC_DB_SUPERUSER_PASSWORD:?set in ../.env}
      # Consumed by init-db.sh (runs once on first boot with an empty volume)
      # to create the `clinica` role and `openclinica` database.
      OC_DB_USER: ${OC_DB_USER:-clinica}
      OC_DB_PASSWORD: ${OC_DB_PASSWORD:?set in ../.env}
      OC_DB_NAME: ${OC_DB_NAME:-openclinica}
    volumes:
      - oc_pgdata:/var/lib/postgresql/data
      # First-boot init: creates role + db. Postgres only runs scripts in this
      # dir when the data volume is EMPTY — to re-run, `docker volume rm
      # biject-oc-pgdata` (destroys all study data!).
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${OC_DB_NAME:-openclinica} || pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ===========================================================================
  # openclinica — one Tomcat (Java 8, bundled in the base image — we use what
  # the image bakes in rather than fighting versions) serving BOTH WARs:
  #   /OpenClinica      — the web UI
  #   /OpenClinica-ws   — the SOAP web services (CRITICAL: this is what the
  #                       write-back spike hits; it is a separate artifact and
  #                       is baked in by our Dockerfile since no community
  #                       image bundles 3.17 + ws together)
  # Image is built locally from ./Dockerfile; put the two WARs in ./dist/
  # first (see README.md).
  # ===========================================================================
  openclinica:
    build:
      context: .
      dockerfile: Dockerfile
    image: biject/openclinica:3.17-ce
    restart: unless-stopped
    networks:
      # Static IP pinned to match infra/hetzner/firewall/ defaults
      # (OC_DIRECT_URL in verify_lockdown.sh probes .30).
      edc_internal:
        ipv4_address: 172.28.100.30
    depends_on:
      oc-db:
        condition: service_healthy
    environment:
      # Rendered into datainfo.properties by docker-entrypoint.sh at start.
      OC_DB_HOST: oc-db
      OC_DB_PORT: "5432"
      OC_DB_USER: ${OC_DB_USER:-clinica}
      OC_DB_PASSWORD: ${OC_DB_PASSWORD:?set in ../.env}
      OC_DB_NAME: ${OC_DB_NAME:-openclinica}
      DEMO_DOMAIN: ${DEMO_DOMAIN:?set in ../.env}
      OC_ADMIN_EMAIL: ${OC_ADMIN_EMAIL:-ops@example.com}
      OC_MAIL_HOST: ${OC_MAIL_HOST:-localhost}
      # ~4 GB host headroom assumed (see scripts/preflight.sh): heap capped so
      # Tomcat + Postgres fit beside the existing stack.
      JAVA_OPTS: "-Xms512m -Xmx1408m -XX:+UseG1GC -Djava.awt.headless=true"
    volumes:
      # OC data directory (filePath in datainfo.properties) — shared by the UI
      # and ws apps, persisted across redeploys.
      - oc_data:/usr/local/tomcat/openclinica.data
    # -------------------------------------------------------------------------
    # Traefik routing — UI ONLY, behind basic-auth.
    # Tradeoff (documented per ticket): the demo needs a browsable UI, so
    # Traefik (which is attached to biject-edc-internal for exactly this) gets
    # a route to Tomcat. The SOAP path is carved OUT of the rule with v3
    # negation (`!PathPrefix`) — plain PathPrefix(`/OpenClinica`) would also
    # match /OpenClinica-ws, silently exposing the write API to the internet.
    # Requires Traefik v3 (../docker-compose.yml pins v3.1); a v2 downgrade
    # would need a deny-router on /OpenClinica-ws instead (see deny-all@file).
    # -------------------------------------------------------------------------
    labels:
      - "traefik.enable=true"
      # Traefik must dial us over the internal network, not its default edge.
      - "traefik.docker.network=biject-edc-internal"
      - "traefik.http.routers.oc-ui.rule=Host(`${DEMO_DOMAIN}`) && PathPrefix(`/OpenClinica`) && !PathPrefix(`/OpenClinica-ws`)"
      - "traefik.http.routers.oc-ui.entrypoints=websecure"
      - "traefik.http.routers.oc-ui.tls.certresolver=letsencrypt"
      - "traefik.http.routers.oc-ui.middlewares=oc-ui-auth@docker,security-headers@file"
      # Basic-auth in front of OC's own login: 2005-era Tomcat apps do not
      # meet 2026 internet exposure standards. Users come from ../.env
      # (htpasswd format, `$` escaped as `$$` — see ../.env.example).
      - "traefik.http.middlewares.oc-ui-auth.basicauth.users=${OC_UI_BASICAUTH_USERS:?set in ../.env}"
      - "traefik.http.services.oc-ui.loadbalancer.server.port=8080"
